name: P5 signer availability (no private key export)
on:
  push:
    branches: [feat/boot-diagnostics-v0422]
    paths:
      - .github/workflows/p5-keystore-presence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-existing-signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check existing P5 signing secret and fingerprint
        shell: bash
        env:
          SIGNAGE_DEBUG_KEYSTORE_B64: ${{ secrets.SIGNAGE_DEBUG_KEYSTORE_B64 }}
          SIGNAGE_STORE_PASSWORD: ${{ secrets.SIGNAGE_STORE_PASSWORD }}
          SIGNAGE_KEY_ALIAS: ${{ secrets.SIGNAGE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          # Only test for the presence of credentials and check the public
          # certificate fingerprint. NEVER print keystore/passwords or upload it.
          if [ -z "${SIGNAGE_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "P5_SIGNER_NOT_CONFIGURED_IN_ANDROID_REPO"
            exit 0
          fi
          if [ -z "${SIGNAGE_STORE_PASSWORD:-}" ]; then
            echo "P5_SIGNER_PASSWORD_NOT_CONFIGURED"
            exit 0
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$SIGNAGE_DEBUG_KEYSTORE_B64" | base64 --decode > "$tmp/original-p5.keystore"
          export SIGNAGE_STORE_PASSWORD
          alias="${SIGNAGE_KEY_ALIAS:-2cam-signage}"
          if ! keytool -exportcert -alias "$alias" -keystore "$tmp/original-p5.keystore" -storepass:env SIGNAGE_STORE_PASSWORD > "$tmp/certificate.der" 2>/dev/null; then
            echo "P5_SIGNER_CREDENTIALS_CANNOT_OPEN_KEYSTORE"
            exit 0
          fi
          cert=$(sha256sum "$tmp/certificate.der" | cut -d' ' -f1)
          if [ "$cert" = "52468eda51fbe7de6886fd800874f73566bdaa7165732e96f03764483840ec2f" ]; then
            echo "P5_ORIGINAL_ANDROID_SIGNER_AVAILABLE"
          else
            echo "P5_SIGNER_CERTIFICATE_MISMATCH"
          fi
