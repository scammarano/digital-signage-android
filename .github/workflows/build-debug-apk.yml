name: Build Android TV debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate 2Cam launcher icon (PNG, Android 4.4 safe)
        run: python3 scripts/create_icon.py
      - name: Verify legacy network compatibility
        run: |
          if grep -R -n -F '.contentLengthLong' app/src/main/java || grep -R -n -F '.getContentLengthLong(' app/src/main/java; then
            echo "::error::API 24 contentLengthLong cannot be used on API 19-22 devices."
            exit 1
          fi
      - name: Compile APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify signed APK and Android 4.4 compatibility
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee app/build/outputs/apk/debug/apk-metadata.txt
          grep -q "sdkVersion:'19'" app/build/outputs/apk/debug/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload signed development build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2Cam-Digital-Signage-v0.4.7-FireOS5-CacheFix
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/apk-metadata.txt
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
