name: Fire Sports direct LAN APK
on:
  push:
    branches: ['feat/sports-direct-lan']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: digital-signage-sports-debug-v1
      - run: python3 scripts/create_icon.py
      - name: Test shared rules and build Fire APK
        run: gradle --no-daemon :sports-core:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signature and legacy compatibility
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/fire-apk-metadata.txt
          grep -q "sdkVersion:'19'" /tmp/fire-apk-metadata.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.digitalsignage.tv.test/com.digitalsignage.tv.SportsInstrumentation | tee /tmp/fire-sports-test.txt
            grep -q SPORTS_FIRE_DIRECT_PASS /tmp/fire-sports-test.txt
      - name: Package Fire APK
        run: |
          mkdir delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/2cam-digital-signage-0.4.10-sports-direct-test.apk
          cp SPORTS_DIRECTO.md delivery/LEEME.md
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 2cam-fire-0.4.10-sports-direct-APK
          path: delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fire-sports-verification
          path: |
            sports-core/build/reports/tests/test/
            /tmp/fire-sports-test.txt
            /tmp/fire-apk-metadata.txt
          if-no-files-found: ignore
