name: Fire Sports direct LAN APK
on:
  push:
    branches: ['feat/sports-direct-lan', 'feat/config-ack-debug-v0411', 'feat/player-playlists-remote-v0412', 'feat/four-modes-parity-v0413']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: digital-signage-sports-debug-v1
      - name: Require original signing certificate
        env:
          SIGNAGE_DEBUG_KEYSTORE_B64: ${{ secrets.SIGNAGE_DEBUG_KEYSTORE_B64 }}
        run: python3 scripts/require_signing_key.py
      - run: python3 scripts/create_icon.py
      - name: Assert DEBUG HUD and runtime ACK are wired
        run: |
          grep -q 'DeviceDebugHud(this)' app/src/main/java/com/digitalsignage/tv/MainActivity.kt
          grep -q 'refreshDebugHud()' app/src/main/java/com/digitalsignage/tv/MainActivity.kt
          grep -q 'onShown:()->Unit' app/src/main/java/com/digitalsignage/tv/MediaDeck.kt
          grep -q 'refreshDebugOverlay()' app/src/main/java/com/digitalsignage/tv/OverlayService.kt
          grep -q 'config_$stage' app/src/main/java/com/digitalsignage/tv/DeviceDebug.kt
      - name: Verify three Android configuration entry points
        run: python3 scripts/check_config_parity.py
      - name: Test shared rules and build Fire APK
        run: gradle --no-daemon :sports-core:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signature and legacy compatibility
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/fire-apk-metadata.txt
          grep -q "sdkVersion:'19'" /tmp/fire-apk-metadata.txt
      - name: Package Fire APK
        run: |
          mkdir delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/2Cam-Digital-Signage-v0.4.14-debug-startup.apk
          cp docs/GUIA_TRANSICIONES_PLAYLISTS_v0412.md delivery/GUIA_TRANSICIONES.md
          cp DEBUG_ACK_LEEME.md delivery/DIAGNOSTICO.md
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 2cam-fire-0.4.14-debug-startup-APK
          path: delivery/
          retention-days: 30
      - name: Download previous APK for in-place upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/scammarano/digital-signage-android/actions/artifacts/12021253415/zip > /tmp/previous-apk.zip
          python3 -c 'import zipfile;z=zipfile.ZipFile("/tmp/previous-apk.zip");p=next(p for p in z.namelist() if p.endswith(".apk"));open("/tmp/previous-apk.apk","wb").write(z.read(p))'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 22
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r /tmp/previous-apk.apk
            adb shell run-as com.digitalsignage.tv mkdir -p files
            adb shell "run-as com.digitalsignage.tv sh -c 'echo retained > files/upgrade-sentinel.txt'"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.digitalsignage.tv cat files/upgrade-sentinel.txt | grep -q retained
            echo IN_PLACE_UPGRADE_0413_TO_0414_PASS
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.digitalsignage.tv.test/com.digitalsignage.tv.SportsInstrumentation | tee /tmp/fire-sports-test.txt
            grep -q SPORTS_FIRE_DIRECT_PASS /tmp/fire-sports-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fire-sports-verification
          path: |
            sports-core/build/reports/tests/test/
            /tmp/fire-sports-test.txt
            /tmp/fire-apk-metadata.txt
          if-no-files-found: ignore

