name: Fire Sports direct LAN APK
on:
  push:
    branches: ['feat/sports-direct-lan', 'feat/config-ack-debug-v0411', 'feat/player-playlists-remote-v0412', 'feat/four-modes-parity-v0413']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: signage_catalog_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptestpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        api: [22, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scammarano/2camdigitaltvweb
          ref: ae6cc0c09c0dda01259450a4c78c810a074e0e6c
          path: portal-fixture
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, zip, openssl
      - name: Generate real PHP29 scoped catalogs for Android contract verification
        run: |
          php -r 'file_put_contents("portal-fixture/config/config.php", "<?php return ".var_export(["app_url"=>"https://catalog.invalid","db_host"=>"127.0.0.1","db_name"=>"signage_catalog_test","db_user"=>"root","db_pass"=>"testpass"],true).";");'
          php portal-fixture/tests/config_tenant_test.php
          php scripts/create_portal_catalog_fixtures.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: digital-signage-sports-debug-v1
      - name: Candidate signing policy
        run: echo 'CI produces a test-signed candidate. Customer delivery requires the permanent private key and certificate verification.'
      - run: python3 scripts/create_icon.py
      - name: Assert DEBUG HUD and runtime ACK are wired
        run: |
          grep -q 'DeviceDebugHud(this)' app/src/main/java/com/digitalsignage/tv/MainActivity.kt
          grep -q 'refreshDebugHud()' app/src/main/java/com/digitalsignage/tv/MainActivity.kt
          grep -q 'onShown:()->Unit' app/src/main/java/com/digitalsignage/tv/MediaDeck.kt
          grep -q 'refreshDebugOverlay()' app/src/main/java/com/digitalsignage/tv/OverlayService.kt
          grep -q 'config_$stage' app/src/main/java/com/digitalsignage/tv/DeviceDebug.kt
      - name: Verify three Android configuration entry points
        run: python3 scripts/check_config_parity.py
      - name: Test shared rules and build Fire APK
        run: gradle --no-daemon :sports-core:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify signature and legacy compatibility
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 19 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/fire-apk-metadata.txt
          grep -q "sdkVersion:'19'" /tmp/fire-apk-metadata.txt
      - name: Package Fire APK
        run: |
          mkdir -p delivery/tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" delivery/tools/apksigner.jar
          cp app/build/outputs/apk/debug/app-debug.apk delivery/2Cam-Digital-Signage-v0.4.20-debug-startup.apk
          cp docs/GUIA_TRANSICIONES_PLAYLISTS_v0412.md delivery/GUIA_TRANSICIONES.md
          cp DEBUG_ACK_LEEME.md delivery/DIAGNOSTICO.md
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: matrix.api == 22
        with:
          name: 2cam-fire-0.4.20-UNSIGNED-CANDIDATE
          path: delivery/
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi enable
            # A default emulator can expose only a cellular IPv4 on radio0. Give its
            # real wlan0 a private test address; do not permit cellular in production.
            adb root
            adb wait-for-device
            adb shell ip link set wlan0 up
            adb shell ip addr replace 172.18.22.2/24 dev wlan0
            adb shell ip -4 address
            adb shell settings put global install_non_market_apps 1
            adb shell settings put secure install_non_market_apps 1
            if [ "${{ matrix.api }}" -ge 26 ]; then adb shell appops set com.digitalsignage.tv REQUEST_INSTALL_PACKAGES allow; fi
            if [ "${{ matrix.api }}" -ge 23 ]; then adb shell appops set com.digitalsignage.tv SYSTEM_ALERT_WINDOW allow; fi
            adb shell am instrument -w com.digitalsignage.tv.test/com.digitalsignage.tv.SportsInstrumentation | tee /tmp/fire-sports-test.txt
            adb exec-out run-as com.digitalsignage.tv cat files/sports-region.png > /tmp/fire-sports-region.png
            grep -q SPORTS_FIRE_DIRECT_PASS /tmp/fire-sports-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fire-sports-verification-api${{ matrix.api }}
          path: |
            sports-core/build/reports/tests/test/
            /tmp/fire-sports-test.txt
            /tmp/fire-apk-metadata.txt
            /tmp/fire-sports-region.png
          if-no-files-found: ignore

